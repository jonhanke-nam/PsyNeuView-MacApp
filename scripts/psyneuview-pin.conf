# The PsyNeuView revision bundled into PsyNeuView.app.
#
# PSYNEUVIEW_REPO is where it comes from. Since 2026-10-13 PsyNeuView is a public
# repository with fresh history (jonhanke-nam/PsyNeuView); the old private
# history, with tags up to v0.5.16, is jonhanke-nam/PsyNeuView-archive. A public
# repo needs no token to fetch or to read its CI results.
#
# PSYNEUVIEW_REF is what gets fetched: a release tag, per the convention that a
# release never bundles a branch ("whatever devel was that day" is the
# staleness problem pinning exists to remove). Always a tag, never a commit ID:
# if PsyNeuView's history is ever rebuilt, its commits get new IDs but its tags
# move with them, so a tag pin keeps working where a commit pin would vanish.
# scripts/check-psyneuview-tested.sh refuses a pin that isn't a tag.
#
# PSYNEUVIEW_VERSION is what users see, and what names the unpacked directory
# under ~/Library/Application Support/PsyNeuView/. It must differ from the last
# bundled version (0.5.16), or an app update would treat the new tree as already
# unpacked and keep the old one.
PSYNEUVIEW_REPO="jonhanke-nam/PsyNeuView"
PSYNEUVIEW_REF="v0.6.3"
PSYNEUVIEW_VERSION="0.6.3"
