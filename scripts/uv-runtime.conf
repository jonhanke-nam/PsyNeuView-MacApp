# The uv binary bundled into PsyNeuView.app, used to install the backend's Python
# dependencies. (#94)
#
# Measured on a clean install of the same backend with the same interpreter:
#   pip, cold cache : 1032s
#   uv,  cold cache :  217s
#   uv,  warm cache :   33s   (a venv rebuild, e.g. after a Python bump, #66)
# The difference is parallel resolution and download across ~100 packages, most
# of the weight being PsyNeuLink's tree (torch, scipy, llvmlite, sympy, onnx).
#
# Pinned by version and checksum, like the Python runtime — a tampered or
# truncated download must fail loudly rather than ship.
UV_VERSION="0.12.15"
UV_SHA256="dc304b9ed1b24174572290fba60ac3f6fe63c73a671f0439e62a91375841964d"
