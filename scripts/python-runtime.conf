# The CPython runtime bundled into PsyNeuView.app.
#
# Pinned by version *and* checksum so a build is reproducible and a tampered or
# truncated download fails loudly rather than shipping. (#64, under #26)
#
# Must satisfy backend/pyproject.toml's requires-python = ">=3.12,<3.15", which
# PythonRequirement.swift also enforces — keep the three in step.
PYTHON_VERSION="3.14.7"
PBS_RELEASE="20260901"
PBS_TRIPLE="aarch64-apple-darwin"
PBS_VARIANT="install_only_stripped"
PBS_SHA256="4632cb1a6edad9e73d3c81b6d2e69131637d995173e3e85005df14102b0592ba"
